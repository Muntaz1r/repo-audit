<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="100%" height="100%" style="background:#0D1117; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients & Glow Filters -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E131A"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>

    <!-- Drop Shadows & Glows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1320" height="620" fill="#0D1117"/>
  <rect width="1320" height="620" fill="url(#bgGlow1)"/>
  <rect width="1320" height="620" fill="url(#bgGlow2)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1320,60 M 0,120 L 1320,120 M 0,180 L 1320,180 M 0,240 L 1320,240 M 0,300 L 1320,300 M 0,360 L 1320,360 M 0,420 L 1320,420 M 0,480 L 1320,480 M 0,540 L 1320,540" stroke="#30363D" stroke-width="1"/>
    <path d="M 60,0 L 60,620 M 180,0 L 180,620 M 300,0 L 300,620 M 420,0 L 420,620 M 540,0 L 540,620 M 660,0 L 660,620 M 780,0 L 780,620 M 900,0 L 900,620 M 1020,0 L 1020,620 M 1140,0 L 1140,620 M 1260,0 L 1260,620" stroke="#30363D" stroke-width="1"/>
  </g>

  <!-- ==================== TOP HEADER ==================== -->
  <g transform="translate(48, 36)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#emeraldGrad)" filter="url(#glow-emerald)"/>
    <text x="19" y="25" fill="#0D1117" font-size="20" font-weight="900" text-anchor="middle" font-family="'JetBrains Mono', monospace">R</text>
    
    <!-- Title -->
    <text x="52" y="22" fill="#F0F6FC" font-size="20" font-weight="700" letter-spacing="-0.5px">Repo<tspan fill="#10B981">Audit</tspan> Architecture Overview</text>
    <text x="52" y="36" fill="#8B949E" font-size="12">Automated Multi-Pillar Static &amp; AI-Driven Repository Review Pipeline</text>
    
    <!-- Status Badge -->
    <g transform="translate(1030, 4)">
      <rect x="0" y="0" width="190" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#3FB950" filter="url(#glow-emerald)"/>
      <text x="30" y="19" fill="#7EE787" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">ASYNC PIPELINE ACTIVE</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTOR LINES ==================== -->
  <g fill="none" stroke="#484F58" stroke-width="2" stroke-dasharray="4,4">
    <!-- Client -> API -->
    <path d="M 230,290 L 290,290" marker-end="url(#arrow-blue)" stroke="#38BDF8"/>
    <!-- API -> Cloner -->
    <path d="M 480,290 L 530,290" marker-end="url(#arrow-green)" stroke="#10B981"/>
    <!-- Cloner to 5 Pillars (Fan-out) -->
    <path d="M 680,290 C 705,290 705,175 730,175" marker-end="url(#arrow)"/>
    <path d="M 680,290 C 705,290 705,230 730,230" marker-end="url(#arrow)"/>
    <path d="M 680,290 L 730,290" marker-end="url(#arrow)"/>
    <path d="M 680,290 C 705,290 705,350 730,350" marker-end="url(#arrow)"/>
    <path d="M 680,290 C 705,290 705,405 730,405" marker-end="url(#arrow)"/>
    
    <!-- 5 Pillars to Aggregator (Fan-in) -->
    <path d="M 1030,175 C 1055,175 1055,290 1080,290" marker-end="url(#arrow)"/>
    <path d="M 1030,230 C 1055,230 1055,290 1080,290" marker-end="url(#arrow)"/>
    <path d="M 1030,290 L 1080,290" marker-end="url(#arrow)"/>
    <path d="M 1030,350 C 1055,350 1055,290 1080,290" marker-end="url(#arrow)"/>
    <path d="M 1030,405 C 1055,405 1055,290 1080,290" marker-end="url(#arrow)"/>
  </g>

  <!-- Labels on connector lines -->
  <text x="260" y="278" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', monospace">POST /url</text>
  <text x="505" y="278" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', monospace">depth=1</text>
  <text x="1055" y="278" fill="#A855F7" font-size="10" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', monospace">scores</text>

  <!-- ==================== STEP 01: FRONTEND CLIENT ==================== -->
  <g transform="translate(48, 175)" filter="url(#shadow)">
    <rect width="180" height="230" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Card Header Tag -->
    <rect x="14" y="14" width="76" height="18" rx="4" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="52" y="27" fill="#38BDF8" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">STEP 01</text>
    
    <text x="14" y="55" fill="#F0F6FC" font-size="15" font-weight="700">Frontend SPA</text>
    <text x="14" y="73" fill="#8B949E" font-size="11">Single-page application with reactive progress polling.</text>
    
    <!-- Mini Tags -->
    <g transform="translate(14, 115)">
      <rect x="0" y="0" width="152" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="15" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">⚡ Vanilla JS &amp; CSS3</text>
      
      <rect x="0" y="28" width="152" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="43" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">📊 Live Status Poller</text>
      
      <rect x="0" y="56" width="152" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="71" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">📑 Markdown Export</text>
    </g>
  </g>

  <!-- ==================== STEP 02: FASTAPI BACKEND ==================== -->
  <g transform="translate(290, 175)" filter="url(#shadow)">
    <rect width="190" height="230" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Card Header Tag -->
    <rect x="14" y="14" width="76" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
    <text x="52" y="27" fill="#10B981" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">STEP 02</text>
    
    <text x="14" y="55" fill="#F0F6FC" font-size="15" font-weight="700">FastAPI API</text>
    <text x="14" y="73" fill="#8B949E" font-size="11">Asynchronous router &amp; background task orchestrator.</text>
    
    <!-- Mini Tags -->
    <g transform="translate(14, 115)">
      <rect x="0" y="0" width="162" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="15" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">🐍 Python 3.11+ ASGI</text>
      
      <rect x="0" y="28" width="162" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="43" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">🛡️ Pydantic Validation</text>
      
      <rect x="0" y="56" width="162" height="22" rx="5" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="10" y="71" fill="#C9D1D9" font-size="10" font-family="'JetBrains Mono', monospace">⚙️ BackgroundTasks</text>
    </g>
  </g>

  <!-- ==================== STEP 03: CLONER & SANDBOX ==================== -->
  <g transform="translate(530, 205)" filter="url(#shadow)">
    <rect width="150" height="170" rx="12" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.5"/>
    <text x="14" y="32" fill="#E6EDF3" font-size="13" font-weight="700">Sandbox Cloner</text>
    <text x="14" y="48" fill="#8B949E" font-size="10">Isolated workspace clone.</text>
    
    <g transform="translate(14, 66)">
      <rect x="0" y="0" width="122" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="8" y="14" fill="#8B949E" font-size="9" font-family="'JetBrains Mono', monospace">GitHub REST API</text>
      
      <rect x="0" y="26" width="122" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="8" y="40" fill="#8B949E" font-size="9" font-family="'JetBrains Mono', monospace">git clone --depth 1</text>
      
      <rect x="0" y="52" width="122" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="8" y="66" fill="#8B949E" font-size="9" font-family="'JetBrains Mono', monospace">100MB Guardrail</text>
    </g>
  </g>

  <!-- ==================== STEP 04: FIVE PARALLEL PILLARS ==================== -->
  <g transform="translate(730, 110)" filter="url(#shadow)">
    <!-- Container Box -->
    <rect width="300" height="360" rx="16" fill="#111620" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <rect x="14" y="12" width="180" height="20" rx="4" fill="#6366F1" fill-opacity="0.15"/>
    <text x="22" y="26" fill="#818CF8" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">5-PILLAR PARALLEL ENGINES</text>
    <text x="286" y="26" fill="#64748B" font-size="10" text-anchor="end" font-family="'JetBrains Mono', monospace">asyncio</text>

    <!-- Pillar 1: Semantic -->
    <g transform="translate(14, 42)">
      <rect width="272" height="52" rx="8" fill="url(#pillarGrad)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#A855F7" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#C084FC" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">01</text>
      <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">Semantic Analysis</text>
      <text x="46" y="38" fill="#A855F7" font-size="10" font-family="'JetBrains Mono', monospace">Gemini 2.5 Flash / Groq</text>
    </g>

    <!-- Pillar 2: Code Eval -->
    <g transform="translate(14, 102)">
      <rect width="272" height="52" rx="8" fill="url(#pillarGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">02</text>
      <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">Code Evaluation</text>
      <text x="46" y="38" fill="#38BDF8" font-size="10" font-family="'JetBrains Mono', monospace">Radon &amp; AST Linters</text>
    </g>

    <!-- Pillar 3: Security -->
    <g transform="translate(14, 162)">
      <rect width="272" height="52" rx="8" fill="url(#pillarGrad)" stroke="#F87171" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#F87171" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#F87171" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">03</text>
      <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">Security &amp; Secrets</text>
      <text x="46" y="38" fill="#F87171" font-size="10" font-family="'JetBrains Mono', monospace">Entropy &amp; Pattern Scanners</text>
    </g>

    <!-- Pillar 4: Docs -->
    <g transform="translate(14, 222)">
      <rect width="272" height="52" rx="8" fill="url(#pillarGrad)" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#FBBF24" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">04</text>
      <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">Documentation Quality</text>
      <text x="46" y="38" fill="#FBBF24" font-size="10" font-family="'JetBrains Mono', monospace">README &amp; Docstring Parser</text>
    </g>

    <!-- Pillar 5: Prod Readiness -->
    <g transform="translate(14, 282)">
      <rect width="272" height="52" rx="8" fill="url(#pillarGrad)" stroke="#34D399" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="8" y="10" width="30" height="30" rx="6" fill="#34D399" fill-opacity="0.2"/>
      <text x="23" y="30" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">05</text>
      <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">Production Readiness</text>
      <text x="46" y="38" fill="#34D399" font-size="10" font-family="'JetBrains Mono', monospace">CI/CD, Docker &amp; Licenses</text>
    </g>
  </g>

  <!-- ==================== STEP 05: VERDICT & STORAGE ==================== -->
  <g transform="translate(1080, 175)" filter="url(#shadow)">
    <!-- Aggregator Card -->
    <rect width="190" height="110" rx="12" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="14" y="28" fill="#C084FC" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">STEP 05 • AGGREGATION</text>
    <text x="14" y="52" fill="#F0F6FC" font-size="14" font-weight="700">Verdict Engine</text>
    <text x="14" y="68" fill="#8B949E" font-size="10">Weighted overall score (0–100) &amp; verdict calculation.</text>
    <text x="14" y="92" fill="#34D399" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">PASS / ATTN / FAIL</text>

    <!-- PostgreSQL Persistence Card -->
    <g transform="translate(0, 122)">
      <rect width="190" height="108" rx="12" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.5"/>
      <text x="14" y="26" fill="#8B949E" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">PERSISTENCE</text>
      <text x="14" y="48" fill="#F0F6FC" font-size="14" font-weight="700">PostgreSQL 16</text>
      <text x="14" y="66" fill="#8B949E" font-size="10">SQLAlchemy 2.0 ORM storing audits, pillars &amp; findings.</text>
      <text x="14" y="90" fill="#38BDF8" font-size="10" font-family="'JetBrains Mono', monospace">Neon.tech / Local Docker</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(48, 565)">
    <line x1="0" y1="0" x2="1224" y2="0" stroke="#21262D" stroke-width="1"/>
    <text x="0" y="22" fill="#64748B" font-size="11">RepoAudit Pipeline • Fast Asynchronous Parallel Execution • Fault-Tolerant Heuristic Fallbacks</text>
    <text x="1224" y="22" fill="#8B949E" font-size="11" text-anchor="end" font-family="'JetBrains Mono', monospace">FastAPI + PostgreSQL + Gemini 2.5 Flash + Docker</text>
  </g>

</svg>
